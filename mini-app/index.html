<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>NetSentinel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Applied before React mounts so the first paint already uses Telegram's
      palette. A file rather than an inline script, for the same reason as the
      panel's: the CSP is script-src 'self' https://telegram.org with no
      'unsafe-inline', so an inline script can only be allowed by a sha256 of its
      own text -- and a browser hashes the element's *complete* child content,
      whitespace included. The Mini App's copy had exactly that problem and had
      never run, so its index.css light :root palette was what every user saw
      first.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
