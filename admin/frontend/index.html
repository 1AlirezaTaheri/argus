<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>NetSentinel Admin</title>
    <!--
      Applied before React mounts so a light-theme user never sees a flash of
      the dark background. A separate file rather than an inline <script>: the
      CSP is script-src 'self' with no 'unsafe-inline', so an inline script has
      to be allowed by a sha256 of its own text -- and a browser hashes the
      element's *complete* child content, the newline after <script> and the
      indent before </script> included. Hash the tidy body instead and the script
      is silently refused. This is not hypothetical: it is what this replaced,
      and the theme had been broken that way while the header looked correct.

      A classic script, not a module: a module is deferred and would run after
      first paint, which is the flash this prevents.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
